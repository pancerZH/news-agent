# news-agent 主配置（相对路径均相对本文件所在目录）。

[paths]
db = "data/news.sqlite"
packets = "data/packets"
runs = "data/runs"
lookups = "data/lookups.jsonl"   # agent 的 search/show/read 调用，供日后训练簇排序
reports = "reports"
feeds = "feeds.toml"
seeds = "memory_seeds.toml"
prompt = "prompts/daily_brief.md"
review_prompt = "prompts/memory_review.md"
transcript_prompt = "prompts/transcript_claims.md"

[collect]
window_hours = 72          # 聚类与 Packet 的时间窗
timeout_seconds = 20
workers = 8
fulltext_min_chars = 240     # 描述短于此值时，摘要改用全文开头
fulltext_max_chars = 200000  # 全文（feed 正文或补抓）入库上限；`news-agent read` 读取

[hn]
enabled = true
front_page_hits = 40
min_points = 80
comment_posts = 12         # 对分数最高的 N 个帖子拉评论树
top_comments = 8

[embedding]
model = "Qwen/Qwen3-Embedding-4B"   # 轻量备选: Qwen/Qwen3-Embedding-0.6B
dim = 1024                          # MRL 截取维度
batch_size = 16
max_seq_length = 512
instruction = "Represent this technology or macroeconomic news article for event clustering and deduplication"

# 阈值按 Qwen3-Embedding-4B 实测标定（2026-11-16）：同事件改写 ~0.96、同事件中英 ~0.84-0.87，
# 而不同的 AI 新闻之间也常到 0.76-0.85，不同公司同模板新闻可达 0.95（靠实体冲突门控拦截）。
# 换用其它模型（如 0.6B）时需重新标定。
[cluster]
high = 0.88     # 单独语义合并阈值（成员余弦 + 质心余弦都要达标）
low = 0.85      # 共享实体时的放宽阈值
top_k = 20      # Packet 中详细展开的事件簇数
macro_k = 6     # Top K 之外再详细展开的宏观（tier 4）簇数

[score]
tier_weights = { "1" = 3.0, "2" = 2.0, "3" = 1.0, "4" = 2.0 }
cross_source = 1.5   # 每多一个独立信源的加分
hn_points = 0.4      # × log1p(points)
hn_comments = 0.3    # × log1p(comments)
watchlist = 1.0      # 每命中一个关注标的的加分

[market]
enabled = true
indices = ["SPY", "QQQ", "SOXX", "DX-Y.NYB", "^VIX"]

[watchlist]
tickers = ["NVDA", "TSM", "AVGO", "ASML", "MSFT", "GOOGL", "META", "AMZN"]

# 实体词典：聚类实体门控 + Watchlist 命中 + init-memory 生成实体卡 aliases。
# 第一个别名作为公司全称；英文别名按大小写敏感 + 词边界匹配，中文别名按子串匹配。
[entities]
NVDA = ["NVIDIA", "Nvidia", "英伟达", "Blackwell", "Rubin", "CUDA", "NVLink", "Jensen Huang"]
TSM = ["TSMC", "Taiwan Semiconductor", "台积电", "CoWoS", "N2", "A16"]
AVGO = ["Broadcom", "博通", "Tomahawk", "Jericho"]
ASML = ["ASML", "阿斯麦", "EUV", "High-NA"]
MSFT = ["Microsoft", "微软", "Azure", "Copilot", "Maia"]
GOOGL = ["Google", "Alphabet", "谷歌", "Gemini", "TPU", "DeepMind", "Google Cloud"]
META = ["Meta Platforms", "Meta", "Llama", "MTIA", "Zuckerberg"]
AMZN = ["Amazon", "亚马逊", "AWS", "Trainium", "Inferentia", "Bedrock"]
AMD = ["AMD", "Advanced Micro Devices", "Instinct", "MI355", "MI400", "MI450"]
INTC = ["Intel", "英特尔", "Gaudi", "18A", "14A"]
MU = ["Micron", "美光", "HBM4"]
SSNLF = ["Samsung", "三星"]
HYNIX = ["SK hynix", "SK Hynix", "海力士"]
ORCL = ["Oracle", "甲骨文", "OCI"]
AAPL = ["Apple", "苹果"]
OPENAI = ["OpenAI", "ChatGPT", "Sam Altman", "Stargate"]
ANTHROPIC = ["Anthropic", "Claude"]
XAI = ["xAI", "Grok"]
DEEPSEEK = ["DeepSeek", "深度求索"]
BABA = ["Alibaba", "阿里巴巴", "Qwen", "通义"]
MISTRAL = ["Mistral"]
FED = ["Federal Reserve", "Fed", "FOMC", "美联储", "Powell"]
ECB = ["European Central Bank", "ECB", "欧央行", "Lagarde"]

# HN 是放大器而非信号源：纯 HN 簇只有标题命中以下主题词（不区分大小写、词边界、可带复数 s）才计入热度与关注池加分，
# 否则只按 tier 权重排入长尾。刻意不含 Amazon / Microsoft / Apple 等消费类大厂名，避免把它们的日常新闻当成信号。
[relevance]
keywords = [
  "AI", "LLM", "GPU", "TPU", "ASIC", "chip", "chipmaker", "semiconductor", "inference", "datacenter", "data center",
  "compute", "HBM", "DRAM", "NAND", "foundry", "lithography", "machine learning", "neural", "transformer", "agent",
  "open-weight", "benchmark", "hyperscaler", "cloud", "capex",
  "Nvidia", "TSMC", "ASML", "Broadcom", "AMD", "Intel", "Micron", "SK hynix", "Cerebras",
  "OpenAI", "Anthropic", "Claude", "Gemini", "DeepMind", "GPT", "Llama", "Qwen", "DeepSeek", "Mistral", "Grok", "vLLM",
  "Federal Reserve", "FOMC", "inflation", "interest rate", "Treasury", "bond yield", "tariff", "GDP", "recession",
  "unemployment", "jobs report", "earnings", "IPO", "valuation", "antitrust", "export control",
]

[memory]
workspace = "~/mindslice"
mindslice = "mindslice"          # CLI；uv run 时来自本项目 venv

# 访谈/播客文稿：prep 时识别带说话人标注的全文与 `vtt = true` 信源的字幕，各起一个 harness 会话抽取带说话人的观点，
# 列进数据包「访谈观点」一节。只处理近 lookback_days 天发布、[entities] 实体提及密度够高的文稿。
[transcripts]
enabled = true
lookback_days = 14
min_density = 8.0    # 每万字符的实体提及数；2026-11-18 实测：算力/半导体访谈 10–24，AI 安全、产品访谈与 Latent Space 多在 1–8
max_per_run = 3      # 每次 prep 最多抽取几篇（每篇 agy 约 2–4 分钟、6–14 万输入 token）
parallel = 3
max_attempts = 3     # 抽取会话失败后，之后的 prep 重试，共计最多几次
vtt_recheck_hours = 48  # 发布不到这么久、节目页还没有字幕的 vtt 条目，每次 prep 再查一遍
packet_claims = 8    # 数据包里每篇最多列几条（其余用 `news-agent claims #<访谈编号>` 查看）

# `news-agent voicecheck TC###`：无标注字幕里的观点要写到个人名下前，用声纹比对抽取时标出的本人片段。
# 阈值按 2026-11-18 两集带标注的 Dwarkesh 节目标定（4–6 位说话人，同一人余弦 ≥0.94、不同人 ≤0.90 占 95%）。
[voice]
cache = "data/audio"
min_sim = 0.92
min_margin = 0.05

# 定时运行（staging 模式）结束后，另起一个独立会话审阅暂存的 invest/* 变更：Agent 只写决定，由程序执行 apply/discard。
[review]
enabled = true

# 日报邮件投递：run 结束后发送（去掉「③ 记忆库变更清单」）；smtp 文件不存在时自动跳过。
[mail]
enabled = true
smtp = "~/.config/news-agent/smtp.toml"   # host / port / username / password / to [/ notify：审阅未完成的通知，默认发信账号]

# ---- Harness：cmd 中 {prompt} 会被替换为渲染后的日报 Prompt；resume 用 {session_id} ----
[harness]
default = "agy"
timeout_minutes = 45

[harness.agy]
# 记忆只能经 `news-agent propose` 写入（一律进 staging/），命令行读记忆用 `news-agent mem`：本会话禁用 MindSlice 的
# MCP write 和整个 mindslice 命令行（deny 按前缀匹配，只禁 `mindslice write` 挡不住 `mindslice -w X write` 和 apply）
cmd = ["agy", "--print={prompt}", "--model", "gemini-4-hydrogen-high", "--output-format", "json",
       "--dangerously-skip-permissions", "--disable-slash-commands", "--settings",
       '{"permissions":{"deny":["mcp(mindslice_mindslice/write)","command(mindslice)","command(uv run mindslice)","command(.venv/bin/mindslice)"]}}']
resume = "agy --conversation {session_id}"

[harness.claude]
cmd = ["claude", "-p", "{prompt}", "--output-format", "json", "--permission-mode", "acceptEdits",
       "--allowedTools",
       "mcp__plugin_mindslice_mindslice__search,mcp__plugin_mindslice_mindslice__read,Read,Write,Edit,Glob,Grep,Bash(uv run news-agent:*)"]
resume = "claude --resume {session_id}"

[harness.codex]
cmd = ["codex", "exec", "--json", "--skip-git-repo-check", "-s", "workspace-write", "{prompt}"]
resume = "codex resume {session_id}"
