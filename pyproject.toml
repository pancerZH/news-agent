[project]
name = "news-agent"
version = "0.1.0"
description = "Tech/AI + macro news distillation and long-term investment thesis tracking, analysed by a local agent harness"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "torch>=2.7",
    "sentence-transformers>=6.0",
    "transformers>=4.51",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "yfinance>=0.2.50",
    "mindslice>=0.2.0",
    "markdown-it-py>=3.0",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
news-agent = "news_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_agent"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
