[[cards]]
id = "invest/theses/ai-compute-capex"
title = "主线: 云厂 AI 资本开支与算力 ROI"
summary = "假设超大规模云厂 AI CapEx 持续高增且可被推理与云收入覆盖，支撑 NVDA/TSM/AVGO/ASML 算力链景气。"
aliases = ["AI capex", "资本开支", "算力 ROI", "hyperscaler capex", "数据中心"]
content = [
  "- **核心假设 (Premise)**: MSFT / GOOGL / AMZN / META 的 AI 资本开支在未来 2 年持续高增，且推理需求与云 AI 收入增长足以覆盖折旧，算力链 (NVDA, TSM, AVGO, ASML) 营收维持高景气。",
  "- **当前状态与置信度 (Conviction)**: 种子假设，初始置信度「中」，待日报积累证据后调整。",
  "- **关键验证记录 (Evidence)**: 暂无。",
  "- **预设证伪条件 (Kill Criteria)**: 若两家以上云厂下调下一年度 CapEx 指引；或云 AI 收入增速连续两个季度低于 CapEx 增速且管理层释放放缓信号；或 GPU 租赁价格与利用率显著下滑，则降级本逻辑。",
  "- **关联**: [[invest/watchlist]]、[[invest/macro/fed-rates-liquidity]]。",
]

[[cards]]
id = "invest/theses/custom-asic-vs-gpu"
title = "主线: 自研 ASIC 与通用 GPU 格局"
summary = "假设云厂自研 ASIC 份额上升但 NVIDIA 凭 CUDA 与机柜级系统维持主导，博通是定制 ASIC 主要受益者。"
aliases = ["ASIC", "GPU", "定制芯片", "custom silicon", "自研芯片"]  # 芯片代号已是实体卡别名，避免 duplicate_alias
content = [
  "- **核心假设 (Premise)**: 云厂自研 ASIC (TPU, Trainium, MTIA, Maia) 与定制芯片方案份额逐步上升，但 NVIDIA 凭 CUDA 生态与 NVLink 机柜级系统在训练与通用推理中维持主导；AVGO 是定制 ASIC 的主要受益者。",
  "- **当前状态与置信度 (Conviction)**: 种子假设，初始置信度「中」。",
  "- **关键验证记录 (Evidence)**: 暂无。",
  "- **预设证伪条件 (Kill Criteria)**: 若头部前沿实验室把主力训练迁移到 ASIC 且 NVDA 数据中心毛利率持续下滑，则削弱「NVIDIA 主导」部分；若主要 ASIC 项目频繁延期或取消，则削弱「AVGO 受益」部分。",
  "- **关联**: [[invest/entities/nvda]]、[[invest/entities/avgo]]、[[invest/entities/googl]]、[[invest/entities/amzn]]。",
]

